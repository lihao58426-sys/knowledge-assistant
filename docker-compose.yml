# ── knowledge-assistant 服务编排 ──
# 用法：
#   docker compose up -d          # 后台启动
#   docker compose down           # 停止
#   docker compose logs -f        # 看日志

services:
  knowledge-assistant:
    build:
      context: .
      args:
        TORCH_CPU: ${TORCH_CPU:-0}   # 本机设 TORCH_CPU=1 装 CPU 版 torch（小 5GB），服务器不设
    container_name: knowledge-assistant
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}       # 从宿主机环境变量传入，不进镜像
      - KA_WORKSPACE_ROOT=/opt                      # 强制指向服务器工作区（容器内代码位置跟宿主机不同）
      - KA_PASSWORD=${KA_PASSWORD:-}             # 可选：设了则所有页面需要密码，不设则跳过鉴权（本地模式）
      - HF_HUB_OFFLINE=1                            # 强制离线，不从 huggingface 联网
      - TRANSFORMERS_OFFLINE=1                      # 同上
    volumes:
      - /opt:/opt                                    # 挂载服务器工作区（所有项目+TO DO）
      - ./chroma_db:/app/chroma_db                 # 向量库持久化：容器删了数据还在
