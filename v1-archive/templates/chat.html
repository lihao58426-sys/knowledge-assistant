<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识库助手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#f8fafc; min-height:100vh; }
  .header { background:#4f46e5; color:#fff; padding:14px 18px; text-align:center;
            font-weight:700; font-size:18px; position:sticky; top:0; z-index:10; }
  .container { max-width:700px; margin:0 auto; padding:16px; }
  .qa { margin-bottom:24px; }
  .q { background:#eff6ff; padding:12px 16px; border-radius:12px 12px 2px 12px;
       font-weight:600; color:#1e40af; margin-bottom:8px; }
  .a { background:#fff; padding:14px 16px; border-radius:12px 12px 12px 2px;
       box-shadow:0 1px 3px rgba(0,0,0,.06); line-height:1.7; white-space:pre-wrap;
       font-size:14px; color:#1e293b; }
  .form-bar { position:sticky; bottom:0; background:#fff; padding:12px 16px;
              border-top:1px solid #e2e8f0; display:flex; gap:8px; }
  .form-bar input { flex:1; padding:10px 14px; border:1px solid #e2e8f0;
                    border-radius:10px; font-size:15px; outline:none; }
  .form-bar input:focus { border-color:#4f46e5; }
  .form-bar button { background:#4f46e5; color:#fff; border:none; padding:10px 20px;
                     border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  .empty { text-align:center; color:#94a3b8; padding:60px 20px; font-size:14px; }
</style>
</head>
<body>

<div class="header">📚 个人知识库助手</div>

<div class="container">
  {% if not question %}
  <div class="empty">
    问我任何关于你的项目、代码、文档的问题。<br>
    例如："crawler.py 反检测做了什么"<br>
    或 "数据库表结构是什么样的"
  </div>
  {% endif %}

  {% if question %}
  <div class="qa">
    <div class="q">{{ question }}</div>
    <div class="a">{{ answer }}</div>
  </div>
  {% endif %}

  {% if error %}
  <div style="color:#ef4444;text-align:center;padding:10px;">{{ error }}</div>
  {% endif %}
</div>

<form class="form-bar" method="post" action="/ask">
  <input name="question" placeholder="问一个问题..." autofocus>
  <button type="submit">发送</button>
</form>

</body>
</html>
