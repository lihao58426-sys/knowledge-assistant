<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逐行讲解</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;overflow:hidden;height:100vh}
.header{background:#1e293b;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #334155;font-size:14px}
.header a{color:#94a3b8;text-decoration:none;font-size:13px}
.header .fname{color:#e2e8f0;font-weight:600;flex:1}
.header button{background:#4f46e5;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500}
.header button:hover{background:#4338ca}
.main{display:flex;height:calc(100vh - 42px)}
/* 左栏：代码 */
.code-pane{width:45%;overflow-y:auto;border-right:1px solid #334155;font-family:"Consolas","Source Code Pro",monospace;font-size:13px;line-height:1.75;padding:8px 0;background:#0f172a}
.code-line{display:flex;cursor:pointer;padding:2px 12px;border-left:3px solid transparent;transition:all .15s}
.code-line:hover{background:#1e293b}
.code-line.active{border-left-color:#818cf8;background:#312e81!important}.code-line.active .cd{color:#e2e8f0}
.code-line.bookmarked{border-left-color:#f59e0b}
.code-line .ln{color:#475569;width:36px;text-align:right;margin-right:12px;user-select:none;flex-shrink:0}
.code-line .cd{color:#94a3b8;white-space:pre-wrap;word-break:break-all}
.code-line .cd .kw{color:#c084fc}
.code-line .cd .str{color:#34d399}
.code-line .cd .cm{color:#64748b;font-style:italic}
.code-line .cd .fn{color:#60a5fa}
/* 右栏：讲解 */
.explain-pane{width:55%;overflow-y:auto;padding:16px;background:#1e293b}
.explain-item{margin-bottom:20px;padding:14px;background:#0f172a;border-radius:10px;border-left:3px solid #4f46e5;font-size:15px;line-height:1.8}
.explain-item .ex-lines{font-size:11px;color:#60a5fa;margin-bottom:6px;font-weight:700}
.explain-item .ex-text{color:#cbd5e1}
.follow-up{margin-top:12px;padding:10px 14px;background:#312e81;border-radius:8px;font-size:14px;color:#c7d2fe;line-height:1.7}
.follow-up .fu-q{color:#818cf8;font-weight:600;margin-bottom:4px}
.empty-state{text-align:center;color:#64748b;padding:60px 20px;font-size:14px;line-height:2}
.bottom-bar{position:fixed;bottom:0;right:0;width:55%;background:#1e293b;padding:12px 16px;border-top:1px solid #334155;display:flex;gap:8px}
.bottom-bar input{flex:1;padding:10px 14px;border:1.5px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none}
.bottom-bar input:focus{border-color:#4f46e5}
.bottom-bar button{background:#4f46e5;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.bottom-bar select{padding:10px;border:1.5px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:13px}
.flash{animation:flashBg .6s ease-out}
@keyframes flashBg{0%{background:#312e81}100%{background:transparent}}
/* 书签面板 */
.bookmark-panel{display:none;position:fixed;top:42px;right:0;width:380px;height:calc(100vh - 42px);background:#0f172a;border-left:1px solid #334155;z-index:20;overflow-y:auto;padding:16px}
.bookmark-panel.show{display:block}
.bookmark-panel h3{font-size:15px;margin-bottom:12px;color:#e2e8f0}
.bookmark-item{padding:10px 12px;background:#1e293b;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:13px;line-height:1.6}
.bookmark-item:hover{background:#334155}
.bookmark-item .bm-file{color:#60a5fa;font-size:11px;margin-bottom:4px}
.bookmark-item .bm-lines{color:#f59e0b;font-weight:600;font-size:12px}
.bookmark-item .bm-code{color:#94a3b8;font-family:monospace;font-size:12px;margin:4px 0}
.bookmark-item .bm-note{color:#64748b;font-size:12px}
.bookmark-del{color:#ef4444;font-size:11px;cursor:pointer;float:right}
</style>
</head>
<body>

<div class="header">
  <a href="/">← 返回</a>
  <span class="fname" id="fname">{{ fname }}</span>
  <button onclick="toggleBookmarks()">🔖 书签 (<span id="bmCount">0</span>)</button>
  <button onclick="toggleExplain()" style="background:#334155">📖 讲解面板</button>
  <select id="projectSelect" onchange="changeProject()" style="font-size:12px">
    {% for p in projects %}<option value="{{ p }}" {% if p==project %}selected{% endif %}>{{ p }}</option>{% endfor %}
  </select>
</div>

<div class="main">
  <!-- 左：代码 -->
  <div class="code-pane" id="codePane"></div>

  <!-- 右：讲解 -->
  <div class="explain-pane" id="explainPane">
    <div class="empty-state">点击左侧代码行号选中 → 点"讲解选中行"按钮<br>或直接加载完整讲解</div>
  </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <span id="selCount" style="font-size:12px;color:#94a3b8;min-width:40px">0行</span>
  <input id="qInput" placeholder="追问（可选，留空自动生成讲解）..." style="flex:1">
  <button onclick="explainSelected()" style="background:#4f46e5">讲解选中</button>
  <button onclick="explainFull()" style="background:#334155">全文讲解</button>
  <button onclick="addBookmark()" style="background:#f59e0b;color:#000">🔖</button>
</div>

<!-- 书签面板 -->
<div class="bookmark-panel" id="bmPanel">
  <h3>🔖 书签 <span style="font-size:12px;color:#94a3b8;font-weight:400">(点击跳转)</span></h3>
  <div id="bmList"></div>
</div>

<script>
const FILE = {{ filepath_json|safe }};
const PROJECT = "{{ project }}";
const FULL_CODE = {{ code_json|safe }};
let currentExplain = [];  // [{start, end, text, followUps:[]}]
let selectedLines = [];

// ── 渲染代码 ──
function renderCode(lines) {
  const pane = document.getElementById('codePane');
  pane.innerHTML = lines.map((l, i) => {
    const ln = i + 1;
    return `<div class="code-line" id="L${ln}" onclick="toggleLine(${ln},event)">
      <span class="ln">${ln}</span>
      <span class="cd">${escapeHtml(l)}</span>
    </div>`;
  }).join('');
  restoreBookmarkHighlights();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 选中/取消行（支持 Shift 范围选、Ctrl 多选）──
let lastClicked = 0;
let ctrlDown = false;
document.addEventListener('keydown', e => { if (e.key==='Control') ctrlDown = true; });
document.addEventListener('keyup', e => { if (e.key==='Control') ctrlDown = false; });

function toggleLine(ln, event) {
  const el = document.getElementById('L'+ln);

  if (event && event.shiftKey && lastClicked > 0) {
    // Shift+点击：范围选中
    const start = Math.min(lastClicked, ln);
    const end = Math.max(lastClicked, ln);
    for (let i = start; i <= end; i++) {
      const l = document.getElementById('L'+i);
      if (l && !l.classList.contains('active')) {
        l.classList.add('active');
        selectedLines.push(i);
      }
    }
    selectedLines = [...new Set(selectedLines)].sort((a,b) => a-b);
  } else if (ctrlDown) {
    // Ctrl+点击：切换单行
    if (el.classList.contains('active')) {
      el.classList.remove('active');
      selectedLines = selectedLines.filter(l => l !== ln);
    } else {
      el.classList.add('active');
      selectedLines.push(ln);
      selectedLines.sort((a,b) => a-b);
    }
  } else {
    // 普通点击：清空旧选择，选中当前行
    document.querySelectorAll('.code-line.active').forEach(l => l.classList.remove('active'));
    selectedLines = [];
    el.classList.add('active');
    selectedLines.push(ln);
  }
  lastClicked = ln;
  updateSelCount();
}

function updateSelCount() {
  const el = document.getElementById('selCount');
  if (el) el.textContent = selectedLines.length;
}

// ── 书签 ──
function getBookmarks() {
  try { return JSON.parse(localStorage.getItem('codeTutorBMs') || '[]'); }
  catch { return []; }
}
function saveBookmarks(bms) { localStorage.setItem('codeTutorBMs', JSON.stringify(bms)); }

function addBookmark() {
  if (selectedLines.length === 0) return alert('请先选中代码行');
  const code = selectedLines.map(ln => FULL_CODE[ln-1]).join('\n');
  const bm = {
    file: FILE, project: PROJECT,
    lines: [Math.min(...selectedLines), Math.max(...selectedLines)],
    code: code.substring(0, 200),
    note: currentExplain.length > 0 ? currentExplain[currentExplain.length-1].text.substring(0, 100) : '',
    date: new Date().toLocaleString()
  };
  const bms = getBookmarks();
  bms.push(bm);
  saveBookmarks(bms);
  updateBmCount();
  restoreBookmarkHighlights();
}

function restoreBookmarkHighlights() {
  const bms = getBookmarks().filter(b => b.file === FILE);
  bms.forEach(b => {
    for (let ln = b.lines[0]; ln <= b.lines[1]; ln++) {
      const el = document.getElementById('L'+ln);
      if (el) el.classList.add('bookmarked');
    }
  });
}

function toggleBookmarks() {
  const panel = document.getElementById('bmPanel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) renderBookmarks();
}
function renderBookmarks() {
  const bms = getBookmarks();
  const list = document.getElementById('bmList');
  if (bms.length === 0) { list.innerHTML = '<div style="color:#64748b;font-size:13px">暂无书签</div>'; return; }
  list.innerHTML = bms.reverse().map((b,i) => `
    <div class="bookmark-item" onclick="jumpToBookmark('${b.file}','${b.project}',${b.lines[0]})">
      <span class="bookmark-del" onclick="event.stopPropagation();deleteBm(${bms.length-1-i})">删除</span>
      <div class="bm-file">${b.project}/${b.file.split('\\').pop()}</div>
      <div class="bm-lines">L${b.lines[0]}-L${b.lines[1]}</div>
      <div class="bm-code">${escapeHtml(b.code)}</div>
      <div class="bm-note">${escapeHtml(b.note)}</div>
      <div class="bm-note">${b.date}</div>
    </div>
  `).join('');
}
function deleteBm(idx) { const bms = getBookmarks(); bms.splice(idx,1); saveBookmarks(bms); renderBookmarks(); updateBmCount(); }

function jumpToBookmark(file, project, ln) {
  if (file !== FILE || project !== PROJECT) {
    window.location.href = `/code-tutor?project=${project}&file=${encodeURIComponent(file)}&line=${ln}`;
    return;
  }
  document.getElementById('bmPanel').classList.remove('show');
  const el = document.getElementById('L'+ln);
  if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),600); }
}
function updateBmCount() {
  document.getElementById('bmCount').textContent = getBookmarks().length;
}

// ── 讲解 ──
let explainVisible = true;
function toggleExplain() { explainVisible = !explainVisible; document.getElementById('explainPane').style.display = explainVisible?'':'none'; }

function explainSelected() {
  if (selectedLines.length === 0) { alert('请先点击左侧代码行号选中代码（可 Shift 范围选）'); return; }
  const start = Math.min(...selectedLines);
  const end = Math.max(...selectedLines);
  const code = FULL_CODE.slice(start-1, end).join('\n');
  const q = document.getElementById('qInput').value.trim() || '请逐行讲解这段代码';
  loadExplain(start, end, `${q}\n\n代码(L${start}-L${end}):\n${code}`);
}

function explainFull() {
  const q = document.getElementById('qInput').value.trim() || '请逐行讲解整个文件，每个函数/类单独一段，说明做什么、为什么这么设计';
  loadExplain(null, null, q);
}

async function loadExplain(start, end, prompt) {
  const pane = document.getElementById('explainPane');
  pane.innerHTML = '<div class="empty-state">⏳ 导师思考中...</div>';

  try {
    const form = new FormData();
    form.append('file', FILE);
    form.append('question', prompt);
    if (start) form.append('line_start', String(start));
    if (end) form.append('line_end', String(end));
    const resp = await fetch('/code-tutor/explain', { method: 'POST', body: form });
    const data = await resp.json();

    if (data.error) { pane.innerHTML = `<div class="empty-state" style="color:#ef4444">❌ ${escapeHtml(data.error)}<br><small>文件: ${escapeHtml(FILE)}</small></div>`; return; }

    // 追加讲解
    const item = {
      start: start, end: end,
      text: data.answer,
      followUps: []
    };
    currentExplain.push(item);
    renderExplainPane();
  } catch(e) {
    pane.innerHTML = `<div class="empty-state" style="color:#ef4444">请求失败: ${e.message}<br><small>文件: ${escapeHtml(FILE)}</small></div>`;
    console.error('loadExplain error:', e);
  }
}

function renderExplainPane() {
  const pane = document.getElementById('explainPane');
  pane.innerHTML = currentExplain.map((ex,i) => `
    <div class="explain-item" id="ex${i}">
      <div class="ex-lines">${ex.start ? 'L'+ex.start+'-L'+ex.end : '全文讲解'}</div>
      <div class="ex-text">${formatExplain(ex.text)}</div>
      ${ex.followUps.map(fu => `
        <div class="follow-up">
          <div class="fu-q">❓ ${escapeHtml(fu.q)}</div>
          <div>${formatExplain(fu.a)}</div>
        </div>
      `).join('')}
      <div style="margin-top:8px;display:flex;gap:6px">
        <button onclick="followUp(${i})" style="background:#334155;color:#e2e8f0;border:none;padding:3px 10px;border-radius:5px;font-size:11px;cursor:pointer">追问</button>
        <button onclick="deleteExplain(${i})" style="background:transparent;color:#ef4444;border:1px solid #ef4444;padding:3px 10px;border-radius:5px;font-size:11px;cursor:pointer">删除</button>
      </div>
    </div>
  `).join('');
  pane.scrollTop = pane.scrollHeight;
}

function formatExplain(text) {
  return escapeHtml(text).replace(/```(\w*)\n?/g, '<pre>').replace(/```/g, '</pre>').replace(/\n/g, '<br>');
}

async function followUp(idx) {
  const q = prompt('追问内容：');
  if (!q) return;
  const ex = currentExplain[idx];
  const form = new FormData();
  form.append('file', FILE);
  form.append('question', q);
  if (ex.start) {
    form.append('line_start', ex.start);
    form.append('line_end', ex.end);
    const code = FULL_CODE.slice(ex.start-1, ex.end).join('\n');
    form.append('context', `之前讲解的代码(L${ex.start}-L${ex.end}):\n${code}`);
  }
  const resp = await fetch('/code-tutor/explain', { method: 'POST', body: form });
  const data = await resp.json();
  if (!data.error) {
    ex.followUps.push({ q, a: data.answer });
    renderExplainPane();
  }
}

function deleteExplain(idx) {
  currentExplain.splice(idx, 1);
  renderExplainPane();
}

function changeProject() {
  const p = document.getElementById('projectSelect').value;
  window.location.href = `/code-tutor?project=${p}`;
}

// ── 初始化 ──
renderCode(FULL_CODE);
updateBmCount();

// URL 行号跳转（从书签来）
const urlParams = new URLSearchParams(window.location.search);
const jumpLine = parseInt(urlParams.get('line'));
if (jumpLine) {
  setTimeout(() => {
    const el = document.getElementById('L'+jumpLine);
    if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),600); }
  }, 300);
}

// 文件列表（如果没传 filepath）
{% if not filepath %}
(function() {
  var pane = document.getElementById('codePane');
  var files = {{ tutor_files_json|safe }};
  if (files.length === 0) {
    pane.innerHTML = '<div class="empty-state" style="padding:60px">请在导师模式中先选择一个项目</div>';
  } else {
    var html = '<div style="padding:16px"><h3 style="margin-bottom:12px;color:#e2e8f0">📁 选择一个文件开始逐行学习</h3>';
    files.forEach(function(f) {
      var name = f.replace(/\\/g,'/').split('/').pop();
      html += '<div style="padding:8px 0"><a href="/code-tutor?project=' + encodeURIComponent(PROJECT) + '&file=' + encodeURIComponent(f) + '" style="color:#60a5fa;text-decoration:none;font-size:14px">' + name + '</a></div>';
    });
    html += '</div>';
    pane.innerHTML = html;
  }
})();
{% endif %}
</script>
</body>
</html>
